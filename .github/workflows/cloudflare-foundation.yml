name: Cloudflare foundation checks

on:
  push:
    branches: [cloudflare-migration]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-foundation.yml'
      - 'client/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-foundation.yml'
      - 'client/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build existing React client
        run: npm run build -w client
      - name: Typecheck original shared, Node and React contracts
        run: npm run typecheck
      - name: Bundle Cloudflare Worker in browser-compatible mode
        run: node --input-type=module -e "import { build } from 'esbuild'; await build({entryPoints:['cloudflare/src/index.ts'],bundle:true,platform:'browser',format:'esm',target:'es2022',outfile:'/tmp/toefl-worker-check.mjs'});"
      - name: Smoke-test Worker adapter (mock D1 and assets)
        run: node --import tsx --test cloudflare/test/worker.test.mjs
      - name: Test Gemini draft validation (mock HTTP, no API key)
        run: node --import tsx --test cloudflare/test/gemini-draft.test.mjs
      - name: Test Gemini model metadata probe without real API calls
        run: node --import tsx --test cloudflare/test/gemini-model-check.test.mjs
      - name: Test manual generation guard (no real API calls)
        run: node --import tsx --test cloudflare/test/manual-generation.test.mjs
      - name: Test Academic Reading approval, grading, privacy and history
        run: node --import tsx --test cloudflare/test/academic-practice.test.mjs
      - name: End-to-end original Reading Set → Attempt → Score → Route → Results
        run: node --import tsx --test cloudflare/test/reading-d1-e2e.test.mjs
      - name: Test automatic Reading refill cost guard, inventory and authentication
        run: node --import tsx --test cloudflare/test/reading-refill.test.mjs
      - name: Check D1 schema can create its tables
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          for migration in sorted(Path('cloudflare/migrations').glob('*.sql')):
              db.executescript(migration.read_text())
          db.execute("INSERT INTO attempts(id,kind,mode,set_id) VALUES('smoke','reading','simulation','test-set')")
          assert db.execute('SELECT COUNT(*) FROM attempts').fetchone()[0] == 1
          assert db.execute("SELECT COUNT(*) FROM sqlite_master WHERE name='academic_practice_attempts'").fetchone()[0] == 1
          assert db.execute("SELECT COUNT(*) FROM sqlite_master WHERE name='reading_sets'").fetchone()[0] == 1
          assert db.execute("SELECT COUNT(*) FROM sqlite_master WHERE name='reading_refill_runs'").fetchone()[0] == 1
          PY
