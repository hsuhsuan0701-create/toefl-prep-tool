name: TOEFL Listening — Use Remaining Free-Tier TTS (Manual Only)

on:
  workflow_dispatch:
    inputs:
      confirm_free_tier:
        description: "I checked Google AI Studio Free Tier, Billing OFF, and both models' remaining RPD today"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: toefl-listening-cloud-tts-once
  cancel-in-progress: false

jobs:
  manual-batch:
    name: Read live D1 inventory, spend only attested remaining per-model caps, stage privately
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require one checkbox confirmation before any Gemini requests
        env:
          CONFIRMED: ${{ inputs.confirm_free_tier }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMED" != 'true' ]]; then
            echo "::error::Tick the Free Tier/Billing and remaining RPD checkbox before running."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Pinned reviewed batch runner; main does not contain Worker sources.
          ref: 5eaad38b3352a820bb5c61ec2b0e462876ec859b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Offline tests (never call Gemini)
        run: |
          node --check scripts/listening-cloud-tts-batch.mjs
          node scripts/listening-cloud-tts-batch.mjs --self-test
          node scripts/listening-cloud-tts-batch.mjs --dry-run
      - name: Read-only inspect of TODAY's Pacific quota, exact D1 progress and private review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOEFL_MANUAL_TEST_TOKEN: ${{ secrets.TOEFL_MANUAL_TEST_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/listening-cloud-tts-batch.mjs --inspect-live
      - name: Install locked dependencies and audio codec tools
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Use remaining attested per-model quota (max 10 each), no retries, private staging
        env:
          LISTENING_BATCH_APPROVED: 'true'
          LISTENING_BATCH_MAX_ATTEMPTS: '20'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOEFL_MANUAL_TEST_TOKEN: ${{ secrets.TOEFL_MANUAL_TEST_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/listening-cloud-tts-batch.mjs --execute
