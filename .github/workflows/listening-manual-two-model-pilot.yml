name: TOEFL Listening — Manual TWO-model Pilot (NO Schedule)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect_only (offline) or run_two (one Lite + one Flash)"
        type: choice
        required: true
        default: inspect_only
        options:
          - inspect_only
          - run_two
      expected_uploaded:
        description: "Current APPROVED/uploaded clips, after approving previous pending review"
        type: string
        required: true
        default: '26'
      pacific_day:
        description: "Today's Google quota date, e.g. 2026-11-17; must match API"
        type: string
        required: true
        default: '2026-11-17'
      confirmation:
        description: "For run_two ONLY: I_VERIFIED_FREE_TIER_AND_APPROVE_TWO_TTS"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: toefl-listening-cloud-tts-once
  cancel-in-progress: false

jobs:
  pilot:
    name: Two bounded Gemini requests; PRIVATE staging and human review ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require exact human consent and expected starting inventory
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_UPLOADED: ${{ inputs.expected_uploaded }}
          PACIFIC_DAY: ${{ inputs.pacific_day }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$MODE" == "inspect_only" || "$MODE" == "run_two" ]] || exit 1
          [[ "$EXPECTED_UPLOADED" =~ ^([0-9]|[12][0-9]|3[0-4])$ ]] || exit 1
          [[ "$PACIFIC_DAY" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          if [[ "$MODE" == "run_two" && "$CONFIRMATION" != "I_VERIFIED_FREE_TIER_AND_APPROVE_TWO_TTS" ]]; then
            echo "::error::Verify the same Gemini project's Free Tier/Billing and per-model RPD before each two-request pilot"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Reviewed and tested pilot source. NEVER checkout default main's older runner.
          ref: 27849d8ab525b1c78c983a33fce57abf266852b9
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Syntax and offline tests (never send requests)
        run: |
          node --check scripts/listening-cloud-tts-batch.mjs
          node scripts/listening-cloud-tts-batch.mjs --self-test
          node scripts/listening-cloud-tts-batch.mjs --dry-run
      - name: Install dependencies and audio utilities ONLY for confirmed run
        if: ${{ inputs.mode == 'run_two' }}
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: One Lite and one Flash, zero retries, PRIVATE R2 staging ONLY
        if: ${{ inputs.mode == 'run_two' }}
        env:
          LISTENING_BATCH_APPROVED: 'true'
          LISTENING_BATCH_PILOT: 'true'
          LISTENING_BATCH_MAX_ATTEMPTS: '2'
          LISTENING_BATCH_EXPECTED_PACIFIC_DAY: ${{ inputs.pacific_day }}
          LISTENING_BATCH_EXPECTED_UPLOADED: ${{ inputs.expected_uploaded }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOEFL_MANUAL_TEST_TOKEN: ${{ secrets.TOEFL_MANUAL_TEST_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/listening-cloud-tts-batch.mjs --execute
