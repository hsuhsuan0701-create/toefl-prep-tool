name: TOEFL Listening — Extra Manual TTS Before Pacific Reset (2026-11-16 ONLY)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect_only (no writes) or generate_one (at most one Gemini request)"
        type: choice
        required: true
        default: inspect_only
        options:
          - inspect_only
          - generate_one
      expected_uploaded:
        description: "Current approved/uploaded count BEFORE this run: 11, 12 or 13"
        type: choice
        required: true
        default: '11'
        options:
          - '11'
          - '12'
          - '13'
      confirmation:
        description: "For generate_one type I_VERIFIED_FREE_TIER_FOR_ONE_MORE_TTS"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: toefl-listening-cloud-tts-once
  cancel-in-progress: false

jobs:
  one-extra:
    name: One extra take only; human review before any next run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify manual approval before requesting any private data
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_UPLOADED: ${{ inputs.expected_uploaded }}
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$MODE" == "inspect_only" || "$MODE" == "generate_one" ]] || { echo "::error::Unsupported mode"; exit 1; }
          [[ "$EXPECTED_UPLOADED" == "11" || "$EXPECTED_UPLOADED" == "12" || "$EXPECTED_UPLOADED" == "13" ]] || { echo "::error::Unexpected count"; exit 1; }
          if [[ "$MODE" == "generate_one" && "$CONFIRM" != "I_VERIFIED_FREE_TIER_FOR_ONE_MORE_TTS" ]]; then
            echo "::error::Explicit same-project Free Tier + one-clip manual consent required"
            exit 1
          fi

      - name: Checkout exact Git version that already produced pilot-r0-lc9
        uses: actions/checkout@v4
        with:
          ref: 7467227f3f3fcdc9e151ec4518d918976f4cf227
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Read-only Pacific-day and pending-review inspection (2 GETs max)
        id: safety
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_UPLOADED: ${{ inputs.expected_uploaded }}
          TOEFL_MANUAL_TEST_TOKEN: ${{ secrets.TOEFL_MANUAL_TEST_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const token = process.env.TOEFL_MANUAL_TEST_TOKEN || '';
          const id = process.env.CF_ACCESS_CLIENT_ID || '';
          const secret = process.env.CF_ACCESS_CLIENT_SECRET || '';
          if (token.length < 32 || !id || !secret) throw Error('Missing private credential; no Gemini');
          const pacificDay = () => {
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit',
            }).formatToParts(new Date());
            const value = k => parts.find(p => p.type === k)?.value;
            return [value('year'),value('month'),value('day')].join('-');
          };
          const origin = 'https://toefl-prep-private.ihsuan0701.workers.dev';
          async function get(endpoint) {
            const response = await fetch(origin + '/api/cloud/listening-refill/' + endpoint, {
              method:'GET',redirect:'error',signal:AbortSignal.timeout(12000),
              headers: {
                Authorization:'Bearer '+token,'CF-Access-Client-Id':id,
                'CF-Access-Client-Secret':secret,Accept:'application/json',
                'Cache-Control':'no-store',
              },
            });
            if (!response.ok) throw Error('Private '+endpoint+' GET HTTP '+response.status+'; STOP');
            if (!(response.headers.get('content-type')||'').includes('application/json'))
              throw Error('Unexpected private response; STOP');
            return response.json();
          }
          const status = await get('status');
          const staged = await get('staged');
          if (status?.day !== pacificDay() || !Array.isArray(status.queue) ||
              !Array.isArray(status.models) || status.models.length !== 2 ||
              staged?.result !== 'pending-human-review' || !Array.isArray(staged.queue)) {
            throw Error('Invalid private Worker response or Pacific day; STOP');
          }
          const draft = status.queue.find(x => x.id === 'lsn-a97620b2c800');
          const c = draft?.clips;
          if (!draft || !c || !['draft','rendering'].includes(draft.state) ||
              !Number.isInteger(c.uploaded) || !Number.isInteger(c.pending)) {
            throw Error('Unexpected draft inventory; STOP');
          }
          const claimed = c.claimed ?? 0, flagged = c.flagged ?? 0;
          const total = c.uploaded + c.pending + claimed + flagged;
          if (total !== 36 || !Number.isInteger(claimed) || !Number.isInteger(flagged))
            throw Error('Inconsistent 36-clip inventory; STOP');

          const lite = status.models.find(x => x.model === 'gemini-3.8-flash-lite-tts');
          const flash = status.models.find(x => x.model === 'gemini-3.8-flash-tts');
          if (!lite || !flash) throw Error('Unknown TTS models; STOP');

          const expectedUploaded = Number(process.env.EXPECTED_UPLOADED);
          // Time-bound to current Pacific day so this extra-run workflow cannot
          // accidentally spend tomorrow's reset quota.
          const validDay = status.day === '2026-11-16';
          const eligible = validDay &&
            status.enabled === true && status.r2Configured === true &&
            c.uploaded === expectedUploaded && c.pending === 36-expectedUploaded &&
            claimed === 0 && flagged === 0 &&
            !status.queue.some(x => Number(x.clips?.claimed || 0) > 0) &&
            staged.queue.length === 0 &&
            lite.dailyLimit === 4 && lite.claimed === expectedUploaded-10 &&
            lite.freeTierVerifiedToday === true && lite.ready === true &&
            flash.dailyLimit === 0 && flash.claimed === 0 && flash.ready === false;
          const info = {pacificDay:status.day, validDay, enabled:status.enabled,
            uploaded:c.uploaded,pending:c.pending,claimed,flagged,
            waitingForHumanReview:staged.queue.length,
            lite:{claimed:lite.claimed,dailyLimit:lite.dailyLimit,ready:lite.ready},
            flash:{claimed:flash.claimed,dailyLimit:flash.dailyLimit,ready:flash.ready},
            eligibleForOneMore:!!eligible};
          console.log(JSON.stringify(info));
          if (process.env.MODE === 'generate_one' && !eligible)
            throw Error('Safety preflight not eligible. STOP without Gemini call.');
          appendFileSync(process.env.GITHUB_OUTPUT,
            'eligible='+((process.env.MODE==='generate_one'&&eligible)?'true':'false')+'\n');
          NODE

      - name: Install ffmpeg / ffprobe when explicitly eligible
        if: steps.safety.outputs.eligible == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install locked dependencies when explicitly eligible
        if: steps.safety.outputs.eligible == 'true'
        run: npm ci

      - name: Offline safety tests, no Gemini
        if: steps.safety.outputs.eligible == 'true'
        run: |
          node --check scripts/listening-cloud-tts-once.mjs
          node --import tsx scripts/listening-cloud-tts-once.mjs --self-test
          node --import tsx scripts/listening-cloud-tts-once.mjs --dry-run

      - name: At most ONE Gemini TTS request; only R2 staging; manual review required
        if: steps.safety.outputs.eligible == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOEFL_MANUAL_TEST_TOKEN: ${{ secrets.TOEFL_MANUAL_TEST_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Gemini key missing; no request"
            exit 1
          fi
          node --import tsx scripts/listening-cloud-tts-once.mjs --once
