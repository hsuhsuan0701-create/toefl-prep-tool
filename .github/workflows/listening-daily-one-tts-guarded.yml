name: TOEFL Listening — Daily One TTS (Human Attestation Required)

on:
  schedule:
    # 10:07 UTC = 18:07 Asia/Taipei. Schedule only runs from default branch.
    - cron: '7 10 * * *'

permissions:
  contents: read

# Share concurrency with the already-proven manual one-take workflow.
concurrency:
  group: toefl-listening-cloud-tts-once
  cancel-in-progress: false

jobs:
  one-take:
    name: At most one verified Free Tier request, then private review
    # An absent GitHub repository variable is FALSE. Never auto-enable it.
    if: ${{ vars.LISTENING_CLOUD_TTS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned, successfully tested one-take runner
        uses: actions/checkout@v4
        with:
          ref: 7467227f3f3fcdc9e151ec4518d918976f4cf227
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Fail-closed Pacific-day attestation, queue and review preflight (GET only)
        id: preflight
        env:
          TOEFL_MANUAL_TEST_TOKEN: ${{ secrets.TOEFL_MANUAL_TEST_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const token = process.env.TOEFL_MANUAL_TEST_TOKEN || '';
          const clientId = process.env.CF_ACCESS_CLIENT_ID || '';
          const clientSecret = process.env.CF_ACCESS_CLIENT_SECRET || '';
          if (token.length < 32 || !clientId || !clientSecret)
            throw Error('Required authentication secrets missing. Never call Gemini.');

          const pacificDay = () => {
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/Los_Angeles', year: 'numeric',
              month: '2-digit', day: '2-digit',
            }).formatToParts(new Date());
            const v = k => parts.find(p => p.type === k)?.value;
            return [v('year'),v('month'),v('day')].join('-');
          };
          const base = 'https://toefl-prep-private.ihsuan0701.workers.dev/api/cloud/listening-refill/';
          const get = async (path) => {
            const res = await fetch(base + path, {
              method:'GET', redirect:'error', signal:AbortSignal.timeout(12000),
              headers: {
                Accept:'application/json', 'Cache-Control':'no-store',
                Authorization:'Bearer '+token,
                'CF-Access-Client-Id':clientId,
                'CF-Access-Client-Secret':clientSecret,
              },
            });
            if (!res.ok) throw Error('Private read-only '+path+' returned HTTP '+res.status);
            if (!(res.headers.get('content-type')||'').includes('application/json'))
              throw Error('Invalid private status response type');
            return res.json();
          };

          const data = await get('status');
          if (data?.day !== pacificDay() || typeof data.enabled !== 'boolean' ||
              typeof data.r2Configured !== 'boolean' ||
              !Array.isArray(data.models) || data.models.length !== 2 ||
              !Array.isArray(data.queue)) {
            throw Error('Invalid Pacific-day or Worker safety status; no TTS');
          }
          const expected = ['gemini-3.8-flash-lite-tts','gemini-3.8-flash-tts'];
          if (!expected.every(n => data.models.some(m => m?.model === n &&
                Number.isInteger(m.dailyLimit) && Number.isInteger(m.claimed) &&
                typeof m.freeTierVerifiedToday === 'boolean' &&
                typeof m.ready === 'boolean'))) {
            throw Error('Invalid TTS model state; no TTS');
          }
          const staged = await get('staged');
          if (staged?.result !== 'pending-human-review' || !Array.isArray(staged.queue))
            throw Error('Unable to inspect existing staged audio; no TTS');

          const drafts = data.queue.filter(d => d?.id === 'lsn-a97620b2c800');
          const draft = drafts.length === 1 ? drafts[0] : null;
          const clips = draft?.clips;
          const uploaded = clips?.uploaded ?? -1;
          const pending = clips?.pending ?? -1;
          const claimed = clips?.claimed ?? 0;
          const flagged = clips?.flagged ?? 0;
          if (draft && (![uploaded,pending,claimed,flagged].every(n => Number.isInteger(n) && n >= 0) ||
                uploaded+pending+claimed+flagged !== 36)) {
            throw Error('Listening inventory inconsistent; no TTS');
          }

          const active = data.models.filter(m =>
            m.dailyLimit === 1 && m.claimed === 0 &&
            m.freeTierVerifiedToday === true && m.ready === true);
          const inactive = data.models.filter(m =>
            m.dailyLimit === 0 && m.claimed === 0 && m.ready === false);
          const anyClaimed = data.queue.some(d => Number(d?.clips?.claimed || 0) > 0);
          const eligible = data.enabled === true && data.r2Configured === true &&
            draft && ['draft','rendering'].includes(draft.state) && pending > 0 &&
            claimed === 0 && flagged === 0 && !anyClaimed && staged.queue.length === 0 &&
            active.length === 1 && inactive.length === 1;
          appendFileSync(process.env.GITHUB_OUTPUT, 'eligible='+(eligible?'true':'false')+'\n');
          if (!eligible) {
            console.log('SAFE SKIP: worker switch, human Free Tier attestation, model cap 1, review or inventory gate not ready.');
            console.log('Gemini calls 0; D1 writes 0; R2 writes 0.');
          } else {
            console.log('ELIGIBLE: Pacific day matches; exactly one model attested TODAY at cap 1.');
            console.log('ELIGIBLE: No outstanding claim or pending human review; runner may claim once.');
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Scheduled Listening TTS — safety check\n\n' +
              '- Pacific day: ' + data.day + '\n' +
              '- Claim permission: **' + (eligible?'eligible for one attempt':'SAFE SKIP') + '**\n' +
              '- Uploaded / pending: ' + uploaded + ' / ' + pending + '\n' +
              '- Claimed / staged pending review: ' + claimed + ' / ' + staged.queue.length + '\n' +
              '- At most one manual-attested model with daily cap 1; no automatic Google billing verification\n');
          }
          NODE

      - name: Install ffmpeg and ffprobe only when eligible
        if: steps.preflight.outputs.eligible == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install locked dependencies only when eligible
        if: steps.preflight.outputs.eligible == 'true'
        run: npm ci

      - name: Offline TTS tests (no Gemini)
        if: steps.preflight.outputs.eligible == 'true'
        run: |
          node --check scripts/listening-cloud-tts-once.mjs
          node --import tsx scripts/listening-cloud-tts-once.mjs --self-test
          node --import tsx scripts/listening-cloud-tts-once.mjs --dry-run

      - name: ONE Gemini TTS take maximum, R2 private staging, NO publication
        if: steps.preflight.outputs.eligible == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOEFL_MANUAL_TEST_TOKEN: ${{ secrets.TOEFL_MANUAL_TEST_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Gemini key unavailable; no request sent"
            exit 1
          fi
          node --import tsx scripts/listening-cloud-tts-once.mjs --once
